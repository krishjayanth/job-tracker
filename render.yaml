# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Values marked `sync: false` are secrets you paste in during setup (see README).
services:
  - type: web
    name: job-tracker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL          # e.g. https://job-tracker-xxxx.onrender.com
        sync: false
      - key: ALLOWED_EMAIL       # the Google account allowed to sign in
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
