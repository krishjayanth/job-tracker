# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Values marked `sync: false` are secrets you paste in during setup (see README).
services:
  - type: web
    name: nuj
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_EMAIL       # Google accounts allowed to sign in, comma-separated, owner first
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL        # Supabase session pooler connection string
        sync: false
      - key: DATABASE_CA         # /etc/secrets/supabase-ca.crt (a Secret File; see docs/DEPLOY.md)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
